<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiorisacall</title>
<meta name="theme-color" content="#241238">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiorisacall">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --ink:#241238; --ink2:#3A2158; --peony:#C72C65; --peony-d:#A81F52;
  --leaf:#2E8B6A; --bg:#FAF6FB; --card:#fff; --line:#E6DBEC; --mute:#6F6380;
  --serif:ui-serif,"New York",Georgia,serif;
  --sans:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.screen{height:100%;display:flex;flex-direction:column}

/* ---------- Login ---------- */
.login{background:var(--ink);color:#fff;position:relative;overflow:hidden;
  padding:env(safe-area-inset-top) 28px calc(env(safe-area-inset-bottom) + 28px)}
.login .bloom{position:absolute;right:-90px;top:-70px;width:340px;height:340px;color:var(--peony);opacity:.9}
.login .hero{margin-top:auto;position:relative}
.word{font-family:var(--serif);font-weight:600;letter-spacing:-.02em}
.login .word{font-size:clamp(44px,14vw,64px);line-height:1}
.login .tag{margin-top:14px;font-size:19px;line-height:1.35;max-width:17em;color:#E9DDF3}
.login .actions{margin-top:36px;display:grid;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:16px;border:0;
  font-weight:600;font-size:17px;cursor:pointer;padding:0 18px}
.btn.google{background:#fff;color:#1d1d1f}
.btn.apple{background:transparent;color:#C9B9DA;border:1.5px dashed #6B4E8C}
.btn[disabled]{cursor:not-allowed}
.login .fine{margin-top:18px;font-size:14px;color:#BBA9D0;min-height:1.4em}
.login .fine.err{color:#FFB3C8}

/* ---------- App ---------- */
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 18px 12px}
.top svg{width:26px;height:26px;color:#F26A9B}
.top .word{font-size:22px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.tab{flex:1;min-height:0;display:flex;flex-direction:column}

.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 8px}
.field label{display:block;font-size:13px;color:var(--mute);margin:0 0 4px 4px}
select{width:100%;min-height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 20px) 20px,calc(100% - 15px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.speaker{display:grid;grid-template-columns:1fr 1fr;margin:6px 16px 4px;padding:4px;background:#EFE5F4;border-radius:16px;gap:4px}
.speaker button{min-height:42px;border:0;border-radius:12px;background:transparent;font-weight:600;font-size:15px;color:var(--mute);cursor:pointer}
.speaker button[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(36,18,56,.18)}

.log{flex:1;min-height:0;overflow-y:auto;list-style:none;padding:12px 16px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.empty{margin:auto;text-align:center;color:var(--mute);max-width:16em;line-height:1.45;font-size:16px}
.msg{max-width:86%;padding:12px 14px;border-radius:18px;background:var(--card);border:1.5px solid var(--line)}
.msg.me{align-self:flex-end;border-bottom-right-radius:6px;background:#F6E4EC;border-color:#EBC3D3}
.msg.other{align-self:flex-start;border-bottom-left-radius:6px}
.msg .orig{font-size:14px;color:var(--mute);line-height:1.35}
.msg .trans{margin-top:5px;font-family:var(--serif);font-size:20px;line-height:1.3;font-weight:600}
.msg .trans.wait{color:var(--mute);font-family:var(--sans);font-size:15px;font-weight:400}

.replay{margin-top:8px;min-height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;color:var(--leaf);cursor:pointer}
.dock{padding:6px 16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
#status{min-height:1.4em;font-size:15px;color:var(--mute);text-align:center}
#status.err{color:var(--peony-d);font-weight:600}
.micwrap{position:relative;width:132px;height:132px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;background:var(--peony);opacity:.22;
  transform:scale(calc(1 + var(--lvl,0) * .55));transition:transform .12s ease-out}
.mic{position:relative;width:112px;height:112px;border-radius:50%;border:0;background:var(--peony);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:16px;cursor:pointer;
  box-shadow:0 8px 20px rgba(199,44,101,.35)}
.mic svg{width:34px;height:34px}
.mic[data-phase="listening"]{background:var(--ink)}
.mic[data-phase="working"],.mic[data-phase="speaking"]{background:var(--leaf)}
.switch{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);min-height:44px}
.switch input{width:22px;height:22px;accent-color:var(--peony)}

.profile{padding:28px 20px;align-items:flex-start;gap:14px}
.profile .who{display:flex;align-items:center;gap:14px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--ink2);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile h2{font-family:var(--serif);font-size:26px}
.profile p{color:var(--mute);font-size:15px;line-height:1.4}
.btn.out{background:var(--card);border:1.5px solid var(--line);margin-top:10px}

nav.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{min-height:56px;border:0;background:transparent;font-weight:600;font-size:14px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--peony)}

@media (prefers-reduced-motion:reduce){.ring{transition:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flower" viewBox="-50 -50 100 100">
    <g fill="currentColor">
      <ellipse rx="14" ry="25" cy="-22"/>
      <ellipse rx="14" ry="25" cy="-22" transform="rotate(72)"/>
      <ellipse rx="14" ry="25" cy="-22" transform="rotate(144)"/>
      <ellipse rx="14" ry="25" cy="-22" transform="rotate(216)"/>
      <ellipse rx="14" ry="25" cy="-22" transform="rotate(288)"/>
    </g>
    <circle r="9" fill="#FAF6FB"/>
  </symbol>
</svg>

<!-- ======== LOGIN ======== -->
<section id="login" class="screen login" hidden>
  <svg class="bloom" aria-hidden="true"><use href="#flower"/></svg>
  <div class="hero">
    <h1 class="word">Fiorisacall</h1>
    <p class="tag">Hablá en tu idioma. Que te escuchen en el suyo.</p>
    <div class="actions">
      <button id="btnGoogle" class="btn google" type="button">
        <svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Continuar con Google
      </button>
      <button class="btn apple" type="button" disabled aria-disabled="true">Apple · próximamente</button>
    </div>
    <p id="loginMsg" class="fine" role="status"></p>
  </div>
</section>

<!-- ======== APP ======== -->
<section id="app" class="screen" hidden>
  <header class="top">
    <svg aria-hidden="true"><use href="#flower"/></svg>
    <span class="word">Fiorisacall</span>
  </header>

  <main>
    <div id="tabTranslate" class="tab">
      <div class="langs">
        <div class="field"><label for="selMe">Yo hablo</label><select id="selMe"></select></div>
        <div class="field"><label for="selOther">La otra persona habla</label><select id="selOther"></select></div>
      </div>
      <div class="speaker" role="radiogroup" aria-label="Quién habla ahora">
        <button type="button" role="radio" id="spkMe" aria-checked="true">Hablo yo</button>
        <button type="button" role="radio" id="spkOther" aria-checked="false">Habla la otra persona</button>
      </div>

      <ol id="log" class="log" aria-live="polite">
        <li class="empty" id="empty">Elegí los idiomas, tocá Hablar y decí algo. Se escucha traducido.</li>
      </ol>

      <div class="dock">
        <p id="status" role="status">Tocá Hablar para empezar</p>
        <div class="micwrap">
          <span class="ring" id="ring" aria-hidden="true"></span>
          <button id="mic" class="mic" type="button" data-phase="idle">
            <svg id="micIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V20H9.5a1 1 0 1 0 0 2h5a1 1 0 1 0 0-2H13v-2.6a6 6 0 0 0 5-5.9z"/></svg>
            <span id="micLabel">Hablar</span>
          </button>
        </div>
        <label class="switch"><input type="checkbox" id="cont"> Conversación continua</label>
      </div>
    </div>

    <div id="tabProfile" class="tab profile" hidden>
      <div class="who">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <div><h2 id="pName"></h2><p id="pMail"></p></div>
      </div>
      <p id="pNote">Tu cuenta quedó registrada con Google. Tus idiomas se guardan en este teléfono.</p>
      <button id="btnOut" class="btn out" type="button">Cerrar sesión</button>
    </div>
  </main>

  <nav class="tabs" aria-label="Secciones">
    <button id="navTranslate" type="button" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h9M8.5 3v2M6 5c.6 3.2 3 5.8 6 7M12 5c-.8 3.6-3.6 6.4-7 7.5M13 21l4-10 4 10M14.4 18h5.2"/></svg>
      Traducir
    </button>
    <button id="navProfile" type="button" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.2-6 8-6s6.8 2 8 6"/></svg>
      Perfil
    </button>
  </nav>
</section>

<audio id="player" playsinline></audio>

<script type="module">
/* ====== CONFIGURACIÓN ======
   Modo prueba (ahora): sin ingreso y sin servidor. Usa el dictado, la traducción gratuita y la voz del teléfono.
   Modo completo (después): completar API_URL y FIREBASE para activar login con Google y voz en la nube. */
const CONFIG = {
  API_URL: "",
  FIREBASE: null   // { apiKey, authDomain, projectId, appId }
};
/* ================================================== */
let initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
    getRedirectResult, onAuthStateChanged, signOut;

const $ = (id) => document.getElementById(id);
const LANGS = [
  ["es","Español"],["en","English"],["pt","Português"],["fr","Français"],["it","Italiano"],
  ["de","Deutsch"],["nl","Nederlands"],["ru","Русский"],["tr","Türkçe"],["ar","العربية"],
  ["hi","हिन्दी"],["ja","日本語"],["ko","한국어"],["zh","中文"]
];
const SILENT_WAV = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";

const S = {
  user: null, me: "es", other: "en", speaker: "me", continuous: false,
  phase: "idle", run: 0, stream: null, rec: null, chunks: [], ctx: null,
  meter: null, heard: false, discard: false, srcNode: null, unlocked: false
};

/* ---------- Firebase / login ---------- */
const configured = !!(CONFIG.FIREBASE && CONFIG.API_URL);
const TEST = !configured;
let auth = null;
if (configured) {
  (async () => {
    try {
      const base = "https://www.gstatic.com/firebasejs/10.12.5/";
      ({ initializeApp } = await import(base + "firebase-app.js"));
      ({ getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
         getRedirectResult, onAuthStateChanged, signOut } = await import(base + "firebase-auth.js"));
      auth = getAuth(initializeApp(CONFIG.FIREBASE));
      getRedirectResult(auth).catch((e) => loginMsg(authError(e), true));
      onAuthStateChanged(auth, (user) => { S.user = user; user ? showApp() : showLogin(); });
    } catch (e) { showLogin(); loginMsg("No se pudo cargar el ingreso. Revisá tu internet.", true); }
  })();
} else {
  showApp();
}

function authError(e) {
  const c = e && e.code || "";
  if (c.includes("popup-closed") || c.includes("cancelled")) return "Cancelaste el ingreso. Probá de nuevo.";
  if (c.includes("unauthorized-domain")) return "Este sitio no está autorizado en Firebase (Authorized domains).";
  if (c.includes("network")) return "Sin conexión. Revisá tu internet e intentá de nuevo.";
  return "No se pudo ingresar con Google. Intentá de nuevo.";
}
function loginMsg(t, err) { const el = $("loginMsg"); el.textContent = t || ""; el.classList.toggle("err", !!err); }

$("btnGoogle").addEventListener("click", async () => {
  if (!auth) return loginMsg("Falta completar la configuración en index.html.", true);
  loginMsg("Abriendo Google…");
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    const c = e && e.code || "";
    if (c.includes("popup-blocked") || c.includes("operation-not-supported")) {
      try { await signInWithRedirect(auth, provider); } catch (e2) { loginMsg(authError(e2), true); }
    } else loginMsg(authError(e), true);
  }
});
$("btnOut").addEventListener("click", async () => { cancelAll(); await signOut(auth); });

function showLogin() { $("login").hidden = false; $("app").hidden = true; }
function showApp() {
  $("login").hidden = true; $("app").hidden = false;
  loginMsg("");
  const u = S.user;
  if (!u) {
    $("pName").textContent = "Modo prueba";
    $("pMail").textContent = "Sin cuenta por ahora";
    $("avatar").textContent = "F";
    $("btnOut").hidden = true;
    $("pNote").textContent = "El ingreso con Google se activa más adelante. Tus idiomas se guardan en este teléfono.";
    loadPrefs(); renderLangs();
    return;
  }
  $("pName").textContent = u.displayName || "Usuario";
  $("pMail").textContent = u.email || "";
  const av = $("avatar"); av.textContent = "";
  if (u.photoURL) { const im = new Image(); im.src = u.photoURL; im.alt = ""; im.referrerPolicy = "no-referrer"; av.appendChild(im); }
  else av.textContent = (u.displayName || u.email || "?").trim().charAt(0).toUpperCase();
  loadPrefs(); renderLangs();
}

/* ---------- Preferencias ---------- */
function prefKey() { return "fc:prefs:" + (S.user ? S.user.uid : "anon"); }
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(prefKey()) || "null");
    if (p && p.me && p.other) { S.me = p.me; S.other = p.other; return; }
  } catch (e) {}
  const nav = (navigator.language || "es").slice(0, 2);
  S.me = LANGS.some(([c]) => c === nav) ? nav : "es";
  S.other = S.me === "en" ? "es" : "en";
}
function savePrefs() { try { localStorage.setItem(prefKey(), JSON.stringify({ me: S.me, other: S.other })); } catch (e) {} }
function renderLangs() {
  for (const [id, val] of [["selMe", S.me], ["selOther", S.other]]) {
    const sel = $(id); sel.textContent = "";
    for (const [c, n] of LANGS) { const o = document.createElement("option"); o.value = c; o.textContent = n; sel.appendChild(o); }
    sel.value = val;
  }
}
$("selMe").addEventListener("change", (e) => { S.me = e.target.value; savePrefs(); });
$("selOther").addEventListener("change", (e) => { S.other = e.target.value; savePrefs(); });

/* ---------- Pestañas ---------- */
function tab(which) {
  const t = which === "translate";
  $("tabTranslate").hidden = !t; $("tabProfile").hidden = t;
  $("navTranslate").setAttribute("aria-selected", t); $("navProfile").setAttribute("aria-selected", !t);
}
$("navTranslate").addEventListener("click", () => tab("translate"));
$("navProfile").addEventListener("click", () => tab("profile"));

/* ---------- Quién habla ---------- */
function setSpeaker(s) {
  S.speaker = s;
  $("spkMe").setAttribute("aria-checked", s === "me");
  $("spkOther").setAttribute("aria-checked", s === "other");
}
$("spkMe").addEventListener("click", () => setSpeaker("me"));
$("spkOther").addEventListener("click", () => setSpeaker("other"));
$("cont").addEventListener("change", (e) => { S.continuous = e.target.checked; });

/* ---------- Estado visual ---------- */
const LABELS = { idle: "Hablar", listening: "Detener", working: "Traduciendo", speaking: "Parar" };
const STATUS = { idle: "Tocá Hablar para empezar", listening: "Escuchando… tocá Detener cuando termines", working: "Traduciendo…", speaking: "Reproduciendo…" };
function setPhase(p) {
  S.phase = p;
  const m = $("mic"); m.dataset.phase = p;
  $("micLabel").textContent = LABELS[p];
  setStatus(p === "listening" && S.continuous ? "Escuchando… dejá de hablar y se traduce solo" : STATUS[p]);
  if (p !== "listening") $("ring").style.setProperty("--lvl", 0);
}
function setStatus(t, err) { const s = $("status"); s.textContent = t; s.classList.toggle("err", !!err); }

/* ---------- Audio: desbloqueo para iPhone ---------- */
function unlockAudio() {
  const p = $("player");
  if (!S.unlocked) { p.src = SILENT_WAV; p.play().then(() => { S.unlocked = true; }).catch(() => {}); }
  if (!S.ctx) S.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (S.ctx.state === "suspended") S.ctx.resume();
  // iPhone: la voz del teléfono solo suena si se activa con un toque del usuario
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}

/* ---------- Botón principal ---------- */
$("mic").addEventListener("click", () => {
  unlockAudio();
  if (S.phase === "idle") startListening();
  else if (S.phase === "listening") stopListening();
  else cancelAll();
});

function cancelAll() {
  S.run++; S.discard = true;
  try { if (S.sr) { const sr = S.sr; S.sr = null; sr.abort(); } } catch (e) {}
  try { if (S.rec && S.rec.state === "recording") S.rec.stop(); } catch (e) {}
  releaseMic();
  const p = $("player"); p.pause(); p.removeAttribute("src");
  try { speechSynthesis.cancel(); } catch (e) {}
  setPhase("idle");
}

function pickMime() {
  for (const m of ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"]) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  }
  return "";
}
function releaseMic() {
  clearInterval(S.meter); S.meter = null;
  try { if (S.srcNode) S.srcNode.disconnect(); } catch (e) {}
  S.srcNode = null;
  if (S.stream) { S.stream.getTracks().forEach((t) => t.stop()); S.stream = null; }
}

async function startListening() {
  if (S.phase !== "idle") return;
  if (TEST) return startListeningBrowser();
  const run = ++S.run;
  setPhase("listening");
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    if (run !== S.run) return;
    setPhase("idle");
    return setStatus("No hay acceso al micrófono. Habilitalo en Ajustes > Safari > Micrófono.", true);
  }
  if (run !== S.run) { stream.getTracks().forEach((t) => t.stop()); return; }
  S.stream = stream; S.chunks = []; S.discard = false;
  const mime = pickMime();
  try { S.rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
  catch (e) { releaseMic(); setPhase("idle"); return setStatus("Este navegador no puede grabar audio.", true); }
  S.rec.ondataavailable = (e) => { if (e.data && e.data.size) S.chunks.push(e.data); };
  S.rec.onstop = () => onRecStop(run, mime);
  S.rec.start();
  startMeter();
}

function startMeter() {
  if (!S.ctx) S.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (S.ctx.state === "suspended") S.ctx.resume();
  const src = S.ctx.createMediaStreamSource(S.stream);
  const an = S.ctx.createAnalyser(); an.fftSize = 1024;
  src.connect(an); S.srcNode = src;
  const buf = new Uint8Array(an.fftSize);
  let floor = 0, silentSince = null; const t0 = performance.now();
  S.heard = false;
  S.meter = setInterval(() => {
    an.getByteTimeDomainData(buf);
    let sum = 0; for (let i = 0; i < buf.length; i++) { const x = (buf[i] - 128) / 128; sum += x * x; }
    const rms = Math.sqrt(sum / buf.length);
    $("ring").style.setProperty("--lvl", Math.min(1, rms * 6).toFixed(2));
    const t = performance.now() - t0;
    if (t < 400) { floor = Math.max(floor, rms); return; }
    const thr = Math.min(0.12, Math.max(0.03, floor * 2.5));
    if (rms > thr) { S.heard = true; silentSince = null; }
    else if (S.heard) { if (silentSince === null) silentSince = t; if (S.continuous && t - silentSince > 1400) stopListening(); }
    else if (S.continuous && t > 15000) { S.discard = true; stopListening(); }
    if (t > 45000) stopListening();
  }, 100);
}

function stopListening() {
  if (S.sr) { try { S.sr.stop(); } catch (e) {} return; }
  if (S.rec && S.rec.state === "recording") S.rec.stop();
}

/* ---------- Modo prueba: dictado del navegador + traducción gratuita + voz del teléfono ---------- */
const LOCALES = {
  es: "es-AR", en: "en-US", pt: "pt-BR", fr: "fr-FR", it: "it-IT", de: "de-DE", nl: "nl-NL",
  ru: "ru-RU", tr: "tr-TR", ar: "ar-SA", hi: "hi-IN", ja: "ja-JP", ko: "ko-KR", zh: "zh-CN"
};

function startListeningBrowser() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return setStatus("Este navegador no tiene dictado. Abrí la app en Safari.", true);
  const run = ++S.run;
  const lang = S.speaker === "me" ? S.me : S.other;
  const sr = new SR();
  sr.lang = LOCALES[lang] || lang;
  sr.interimResults = true; sr.continuous = false; sr.maxAlternatives = 1;
  let fin = "", part = "", err = "";
  S.sr = sr; S.discard = false;
  setPhase("listening");
  sr.onresult = (e) => {
    let f = "", p = "";
    for (let i = 0; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) f += r[0].transcript; else p += r[0].transcript;
    }
    fin = f; part = p;
    if (run === S.run) setStatus("Escuché: " + (f + p));
  };
  sr.onerror = (e) => { err = e.error || "error"; };
  sr.onend = () => {
    if (S.sr === sr) S.sr = null;
    if (run !== S.run) return;
    const text = (fin || part).trim();
    if (text) return processText(text, run);
    setPhase("idle");
    if (err === "not-allowed" || err === "service-not-allowed") {
      return setStatus("Sin permiso. Activá el micrófono para Safari y el dictado en Ajustes > General > Teclado.", true);
    }
    if (err && err !== "no-speech" && err !== "aborted") return setStatus("No se pudo escuchar (" + err + "). Probá de nuevo.", true);
    setStatus("No se escuchó nada. Probá de nuevo.", true);
    if (S.continuous && (!err || err === "no-speech")) setTimeout(() => { if (run === S.run && S.phase === "idle" && S.continuous) startListening(); }, 400);
  };
  try { sr.start(); }
  catch (e) { S.sr = null; setPhase("idle"); setStatus("No se pudo iniciar el micrófono. Probá de nuevo.", true); }
}

async function translateFree(text, from, to) {
  if (from === to) return text;
  const code = (c) => (c === "zh" ? "zh-CN" : c);
  const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) +
    "&langpair=" + code(from) + "|" + code(to);
  let res;
  try { res = await fetch(url); } catch (e) { throw new ApiError(0, "network"); }
  if (!res.ok) throw new ApiError(res.status, "translate");
  const data = await res.json();
  const out = data && data.responseData && data.responseData.translatedText;
  if (!out || (data.responseStatus && Number(data.responseStatus) !== 200)) {
    throw new ApiError(Number(data && data.responseStatus) || 500, "translate");
  }
  return out;
}

async function processText(text, run) {
  const alive = () => run === S.run;
  setPhase("working");
  const spk = S.speaker;
  const from = spk === "me" ? S.me : S.other;
  const to = spk === "me" ? S.other : S.me;
  try {
    const entry = addEntry(spk, text);
    const translated = await translateFree(text, from, to);
    if (!alive()) return;
    entry.setTrans(translated, to);
    setPhase("speaking");
    await speakLocal(translated, to, alive);
  } catch (e) {
    if (!alive()) return;
    setStatus(errorText(e), true);
    return afterTurn(run, true);
  }
  afterTurn(run, false);
}

function onRecStop(run, mime) {
  const heard = S.heard;
  const type = (S.rec && S.rec.mimeType) || mime || "audio/mp4";
  const blob = new Blob(S.chunks, { type });
  releaseMic();
  if (run !== S.run) return;
  if (S.discard || blob.size < 1000) {
    setPhase("idle");
    if (S.continuous && !heard && S.discard) setTimeout(() => { if (S.phase === "idle" && S.continuous) startListening(); }, 200);
    return;
  }
  process(blob, run);
}

/* ---------- Traducción ---------- */
class ApiError extends Error { constructor(status, detail) { super(detail || "api"); this.status = status; } }

async function api(path, { json, body, type } = {}) {
  const token = await auth.currentUser.getIdToken();
  const headers = { Authorization: "Bearer " + token };
  let payload = body;
  if (json) { headers["Content-Type"] = "application/json"; payload = JSON.stringify(json); }
  else if (type) headers["Content-Type"] = type;
  let res;
  try { res = await fetch(CONFIG.API_URL + path, { method: "POST", headers, body: payload }); }
  catch (e) { throw new ApiError(0, "network"); }
  if (!res.ok) { let d = ""; try { d = (await res.json()).error || ""; } catch (e) {} throw new ApiError(res.status, d); }
  return res;
}

function errorText(e) {
  if (e.status === 401) return "Tu sesión venció. Cerrá sesión y volvé a entrar.";
  if (e.status === 413) return "El audio es muy largo. Hablá en frases más cortas.";
  if (e.status === 429) return "Se agotó el uso gratuito por ahora. Probá más tarde.";
  if (e.status === 0) return "No hay conexión con el servidor. Revisá tu internet.";
  return "No se pudo traducir. Probá de nuevo.";
}

async function process(blob, run) {
  const alive = () => run === S.run;
  setPhase("working");
  const spk = S.speaker;
  const from = spk === "me" ? S.me : S.other;
  const to = spk === "me" ? S.other : S.me;
  try {
    const r1 = await api("/stt?lang=" + from, { body: blob, type: blob.type || "application/octet-stream" });
    const { text } = await r1.json();
    if (!alive()) return;
    if (!text) { setStatus("No se escuchó nada. Probá de nuevo.", true); return afterTurn(run, true); }
    const entry = addEntry(spk, text);
    const r2 = await api("/translate", { json: { text, from, to } });
    const { translated } = await r2.json();
    if (!alive()) return;
    entry.setTrans(translated);
    setPhase("speaking");
    await speak(translated, to, alive);
  } catch (e) {
    if (!alive()) return;
    setStatus(errorText(e), true);
    return afterTurn(run, true);
  }
  afterTurn(run, false);
}

function afterTurn(run, failed) {
  if (run !== S.run) return;
  const again = S.continuous && !failed;
  S.phase = "idle"; $("mic").dataset.phase = "idle"; $("micLabel").textContent = LABELS.idle;
  if (!failed) setStatus(STATUS.idle);
  if (again) setTimeout(() => { if (run === S.run && S.phase === "idle" && S.continuous) startListening(); }, 350);
}

async function speak(text, lang, alive) {
  try {
    const r = await api("/tts", { json: { text, lang } });
    const blob = await r.blob();
    if (!alive()) return;
    await playBlob(blob);
  } catch (e) {
    if (!alive()) return;
    if (e.status === 401) throw e;
    setStatus("La voz en la nube no respondió; uso la voz del teléfono.", true);
    await speakLocal(text, lang);
  }
}
function playBlob(blob) {
  return new Promise((resolve, reject) => {
    const p = $("player"); const url = URL.createObjectURL(blob);
    const done = (fn, v) => { URL.revokeObjectURL(url); p.onended = p.onerror = null; fn(v); };
    p.onended = () => done(resolve);
    p.onerror = () => done(reject, new Error("play"));
    p.src = url;
    p.play().catch((e) => done(reject, e));
  });
}
function pickVoice(lang) {
  const vs = speechSynthesis.getVoices() || [];
  const want = (LOCALES[lang] || lang).toLowerCase();
  const norm = (v) => v.lang.replace("_", "-").toLowerCase();
  return vs.find((v) => norm(v) === want) || vs.find((v) => norm(v).startsWith(lang)) || null;
}
function speakLocal(text, lang, alive) {
  return new Promise((resolve) => {
    let done = false;
    const finish = () => { if (!done) { done = true; clearTimeout(guard); resolve(); } };
    const guard = setTimeout(finish, Math.max(5000, text.length * 140));
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LOCALES[lang] || lang;
      const v = pickVoice(lang); if (v) u.voice = v;
      u.volume = 1; u.rate = 1;
      u.onend = u.onerror = finish;
      speechSynthesis.resume();
      speechSynthesis.speak(u);
    } catch (e) { finish(); }
  });
}

/* ---------- Conversación en pantalla ---------- */
function addEntry(spk, orig) {
  const empty = $("empty"); if (empty) empty.remove();
  const li = document.createElement("li");
  li.className = "msg " + (spk === "me" ? "me" : "other");
  const o = document.createElement("div"); o.className = "orig"; o.textContent = orig;
  const t = document.createElement("div"); t.className = "trans wait"; t.textContent = "Traduciendo…";
  li.append(o, t);
  const log = $("log"); log.appendChild(li); log.scrollTop = log.scrollHeight;
  return {
    setTrans(txt, lang) {
      t.className = "trans"; t.textContent = txt;
      if (lang) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "replay"; b.textContent = "Escuchar de nuevo";
        b.addEventListener("click", () => { unlockAudio(); speakLocal(txt, lang); });
        li.appendChild(b);
      }
      log.scrollTop = log.scrollHeight;
    }
  };
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
